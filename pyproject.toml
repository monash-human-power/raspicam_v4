[project]
name = "raspicam"
version = "1.0.0"
description = "Code for the MHP camera system"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.7,<3.8"
dependencies = [
    "opencv-python>=4,<5",
    "paho-mqtt>=1.5.0,<2",
    "python-dotenv>=0.13.0,<0.14",
    "picamera~=1.13 ; platform_machine == 'armv6l' or platform_machine == 'armv7l'",
    "RPi.GPIO>=0.7.0,<0.8 ; platform_machine == 'armv6l' or platform_machine == 'armv7l'",
    "adafruit-circuitpython-mcp3xxx>=1.4.5,<2 ; platform_machine == 'armv6l' or platform_machine == 'armv7l'",
]

[dependency-groups]
dev = [
    "pylint>=2.5.2,<3",
    "pytest>=5.4.1,<6",
    "black~=19.10b0",
    "flake8>=3.8.3,<4",
]

[tool.uv]

[tool.black]
line-length = 79

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
